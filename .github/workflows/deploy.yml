name: Deploy to GitHub Pages

on:
  # Deploy on every push to the default branch.
  push:
    branches: [main]
  # Allow manually re-running a deploy from the Actions tab.
  workflow_dispatch:

# Least-privilege token: read the repo, write the Pages deployment + OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one live deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Project site is served from https://<user>.github.io/<repo>/,
          # so the app must be built for that subpath (see vite.config.js).
          VITE_BASE: /${{ github.event.repository.name }}/
          # Optional: point the SPA at a deployed backend + Supabase. Set these
          # in Settings > Secrets and variables > Actions. Empty is fine — the
          # app falls back to its offline localStorage cache.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Add SPA fallback + disable Jekyll
        # GitHub Pages has no server-side rewrites, so deep links like
        # /paths/google return 404 unless a 404.html boots the SPA. .nojekyll
        # stops Pages from stripping files that start with an underscore.
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
