# Render Blueprint for the Node/Express API (server/).
# Deploy: push this repo to GitHub, then in Render → "New +" → "Blueprint",
# pick this repo. Render reads this file and creates the service. Fill in the
# secret env vars (marked sync:false) in the dashboard when prompted.
#
# The frontend lives on Vercel; this service only serves /api/*.
services:
  - type: web
    name: fe-interview-api
    runtime: node
    plan: free # free tier sleeps after ~15 min idle (first request cold-starts ~50s)
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      # Secrets — set these in the Render dashboard, not in git.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Comma-separated list of allowed browser origins (your Vercel URL[s]).
      # e.g. https://fe-interview-questions.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Render provides PORT automatically; server/env.js already reads it.
